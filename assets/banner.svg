<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="mdtoc - tables of contents for Markdown">
  <style>
    .t{font:700 54px monospace;fill:#e6edf3}
    .s{font:18px monospace;fill:#8b949e}
    .l{font:20px monospace;fill:#58a6ff;opacity:0;animation:in 6s ease-in-out infinite}
    .b{fill:#30363d}
    @keyframes in{0%{opacity:0;transform:translateX(-14px)}12%,80%{opacity:1;transform:translateX(0)}95%,100%{opacity:0}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .c{fill:#58a6ff;animation:blink 1s steps(1) infinite}
  </style>
  <rect width="800" height="200" rx="14" fill="#0d1117"/>
  <text x="40" y="100" class="t">mdtoc</text>
  <rect x="222" y="58" width="6" height="46" class="c"/>
  <text x="42" y="138" class="s">tables of contents for Markdown</text>
  <rect x="440" y="30" width="2" height="140" class="b"/>
  <text x="465" y="62" class="l" style="animation-delay:0s">- Install</text>
  <text x="465" y="92" class="l" style="animation-delay:.5s">- Usage</text>
  <text x="495" y="122" class="l" style="animation-delay:1s">- Options</text>
  <text x="465" y="152" class="l" style="animation-delay:1.5s">- License</text>
</svg>
